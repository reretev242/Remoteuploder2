name: 🚀 1DM to MEGA Direct Uploader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 1DM se Copy kiya hua Link (.mp4 / .m3u8 / Page Link)'
        required: true
        type: string
      file_name:
        description: '🎬 Video ka Naam (Bina .mp4 lagaye, jaise: Movie_Part1)'
        required: true
        default: 'My_1DM_Video'
        type: string
      referer_url:
        description: '🌐 Main Website Page Link (Zaroori agar CDN link hai)'
        required: false
        type: string
      mega_folder:
        description: '📁 MEGA Cloud Folder Name'
        required: true
        default: '/1DM_Uploads'
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 🛠️ Install Tools (yt-dlp + curl-cffi, FFmpeg, MEGAcmd)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg python3-pip curl wget
          
          # yt-dlp ke saath Cloudflare Impersonation (curl-cffi) install karein
          pip install -U --break-system-packages "yt-dlp[default,curl-cffi]"
          
          # MEGAcmd install karein
          wget -q https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb
          sudo apt-get install -y ./megacmd-xUbuntu_24.04_amd64.deb || sudo apt-get install -f -y

      - name: 📥 Download Video (With Cloudflare Impersonation)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          FILE_NAME: ${{ inputs.file_name }}
          REFERER: ${{ inputs.referer_url }}
        run: |
          mkdir -p downloads
          cd downloads
          
          echo "Downloading: $FILE_NAME ..."
          
          # Agar Referer diya hai toh use lagayein, warna video URL ke domain ko hi Referer bana lein
          if [ -z "$REFERER" ]; then
            AUTO_REF=$(echo "$VIDEO_URL" | awk -F/ '{print $1"//"$3"/"}')
          else
            AUTO_REF="$REFERER"
          fi
          
          echo "Using Referer: $AUTO_REF"
          
          yt-dlp "$VIDEO_URL" \
            --impersonate chrome \
            --extractor-args "generic:impersonate" \
            --referer "$AUTO_REF" \
            --add-header "Origin:${AUTO_REF%/}" \
            -N 16 \
            --merge-output-format mp4 \
            --no-check-certificates \
            -o "${FILE_NAME}.%(ext)s"
          
          echo "✅ Download Complete! File Details:"
          ls -lh

      - name: ☁️ Upload Directly to MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASS: ${{ secrets.MEGA_PASSWORD }}
          MEGA_DIR: ${{ inputs.mega_folder }}
        run: |
          echo "Logging into MEGA..."
          mega-login "$MEGA_EMAIL" "$MEGA_PASS"
          
          mega-mkdir -p "$MEGA_DIR"
          
          echo "Uploading file to MEGA ($MEGA_DIR)..."
          for file in downloads/*; do
            if [ -f "$file" ]; then
              mega-put -c "$file" "$MEGA_DIR/"
            fi
          done
          
          echo "🎉 Successfully Uploaded to MEGA!"
          mega-logout
          
